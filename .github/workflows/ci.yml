name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch for the transcoder tests; the GPU experiments are not run in CI)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[analysis,viz,dev]" safetensors
      - name: Lint
        run: ruff check tracecxr tests
      - name: Test
        run: pytest -q
      - name: Every number in the paper regenerates from results/
        run: |
          python paper/make_numbers.py
          git diff --exit-code paper/numbers.tex paper/tables
